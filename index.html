<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>DARK MUSCLE ROUTINE BUILDER + TRAINING LOG</title>
<style>
:root{--bg:#050505;--cd:#111;--ln:#2a2a2a;--rd:#e10600;--tx:#f2f2f2;--mu:#8f8f8f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:10}
header{padding:14px 16px 6px;text-align:center}
header b{font-size:26px;letter-spacing:5px;font-weight:900}header b i{color:var(--rd);font-style:normal}
header span{display:block;font-size:11px;letter-spacing:6px;color:var(--rd);font-weight:700}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;background:#000;border-bottom:1px solid var(--rd)}
nav::-webkit-scrollbar{display:none}nav{overflow-x:auto;scrollbar-width:none}nav button{flex:1 0 auto;padding:0 13px;min-height:44px;background:none;border:0;color:var(--mu);font-weight:800;font-size:12px;letter-spacing:1.5px}
nav button.on{color:#fff;box-shadow:inset 0 -3px var(--rd)}
.w{max-width:720px;margin:auto;padding:12px 14px 60px}
.card{background:var(--cd);border:1px solid var(--ln);border-left:3px solid var(--rd);border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:13px;letter-spacing:2px;color:var(--rd);text-transform:uppercase}
label{display:block;font-size:11px;color:var(--mu);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
select,input,textarea{display:block;width:100%;margin-top:3px;min-height:44px;background:#000;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:16px;font-family:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btn{width:100%;min-height:48px;margin:0 0 10px;background:var(--rd);color:#fff;border:0;border-radius:10px;font-weight:900;letter-spacing:2px;font-size:14px}
.btn.g{background:#000;border:1px solid var(--rd)}
.btn.s{width:48px;margin:0}
.row{display:flex;gap:8px;margin-bottom:8px}.row input{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{min-height:38px;padding:0 12px;background:#000;color:var(--tx);border:1px solid var(--ln);border-radius:20px;font-weight:700;font-size:13px}
.chip.on{background:var(--rd);border-color:var(--rd)}
.ex{border-top:1px solid var(--ln);padding:8px 0}.ex small{color:var(--mu);margin-left:6px}
.ctl{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.ctl .b{width:40px;height:40px;background:#000;color:#fff;border:1px solid var(--ln);border-radius:8px;font-size:16px}
.ctl input.n{width:52px;margin:0;text-align:center;padding:4px}
.pl{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;padding:7px 0;border-top:1px solid var(--ln);font-size:14px}
.pl em{color:var(--rd);font-style:normal;font-weight:800}.pl .no{grid-column:1/-1;color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-top:1px solid var(--ln);text-align:left}th{color:var(--mu);font-size:11px}
tr.dl td{color:var(--rd);font-weight:800}
.vb{display:grid;grid-template-columns:86px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.vb div{height:8px;background:#000;border-radius:4px;overflow:hidden}.vb div i{display:block;height:100%;background:var(--rd)}
.m{color:var(--mu);font-size:12px;margin:4px 0 0}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--rd);padding:10px 16px;border-radius:20px;font-weight:700;display:none;z-index:20}
.btn.t{width:auto;padding:0 14px;margin:0;min-height:40px;font-size:12px}
.sr{display:grid;grid-template-columns:22px 1fr 1fr 54px 46px;gap:6px;align-items:center;margin-bottom:6px}.sr input{margin:0;text-align:center;padding:4px}.sr b{color:var(--mu);font-size:13px;text-align:center}
.ok{height:44px;background:#000;border:1px solid var(--ln);border-radius:8px;color:var(--mu);font-size:18px}.ok.on{background:var(--rd);color:#fff;border-color:var(--rd)}
.pr{color:var(--rd);font-weight:900;font-size:12px}.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{display:grid;grid-template-columns:50px 1fr 64px;gap:8px;align-items:center;font-size:12px;margin:5px 0}.bar div{height:9px;background:#000;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--rd)}
.st{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}.st div{background:#000;border:1px solid var(--ln);border-radius:8px;padding:8px;text-align:center}.st b{display:block;font-size:18px;color:#fff}.st span{font-size:10px;color:var(--mu);letter-spacing:1px}
#tm{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;background:var(--rd);text-align:center;padding:14px;border-radius:12px;font-weight:900;letter-spacing:2px;z-index:20}
@media print{body{background:#fff;color:#000}body::before,header,nav,button,.noprint{display:none!important}.card{background:#fff;border-color:#999;color:#000}}
</style></head><body>
<header><b>DARK <i>MUSCLE</i></b><span>ROUTINE BUILDER + TRAINING LOG</span></header>
<nav id="nv"></nav><div class="w" id="app"></div><div id="tm" onclick="rs0()"></div><div id="t"></div>
<script>
const MU=['Pecho','Espalda','Hombro','Bíceps','Tríceps','Cuádriceps','Isquios','Glúteo','Gemelo','Abdomen'];
const LM={Pecho:[8,12,20],Espalda:[10,14,22],Hombro:[8,14,22],'Bíceps':[6,12,20],'Tríceps':[6,10,18],'Cuádriceps':[8,12,18],Isquios:[6,10,16],'Glúteo':[0,8,16],Gemelo:[8,12,20],Abdomen:[0,8,16]};
const E=`Press banca plana|0|1|g;Press inclinado con mancuernas|0|1|d;Press inclinado con barra|0|1|g;Press en máquina|0|1|g;Fondos en paralelas|0|1|b;Flexiones lastradas|0|1|b;Aperturas en polea|0|0|g;Aperturas con mancuernas|0|0|d;Pec deck|0|0|g;Dominadas|1|1|b;Jalón al pecho|1|1|g;Remo con barra|1|1|g;Remo con mancuerna|1|1|d;Remo en T|1|1|g;Remo en polea baja|1|1|g;Remo invertido|1|1|b;Pullover en polea|1|0|g;Press militar con barra|2|1|g;Press de hombro con mancuernas|2|1|d;Pike push-up|2|1|b;Elevaciones laterales|2|0|d;Laterales en polea|2|0|g;Pájaros con mancuernas|2|0|d;Face pull|2|0|g;Curl con barra|3|0|g;Curl con mancuernas|3|0|d;Curl martillo|3|0|d;Curl predicador|3|0|g;Curl inclinado|3|0|d;Press cerrado|4|1|g;Press francés|4|0|g;Extensión en polea|4|0|g;Extensión sobre la cabeza|4|0|d;Fondos en banco|4|0|b;Flexiones diamante|4|1|b;Sentadilla trasera|5|1|g;Prensa de piernas|5|1|g;Sentadilla hack|5|1|g;Sentadilla búlgara|5|1|d;Sentadilla goblet|5|1|d;Zancadas|5|1|d;Extensión de cuádriceps|5|0|g;Sentadilla a una pierna|5|1|b;Peso muerto rumano|6|1|g;Peso muerto rumano con mancuernas|6|1|d;Curl femoral tumbado|6|0|g;Curl femoral sentado|6|0|g;Curl nórdico|6|0|b;Buenos días|6|1|g;Hip thrust|7|1|g;Hip thrust con mancuerna|7|1|d;Patada en polea|7|0|g;Abducción en máquina|7|0|g;Puente de glúteo a una pierna|7|0|b;Gemelo de pie|8|0|g;Gemelo sentado|8|0|g;Gemelo con mancuerna|8|0|d;Gemelo en escalón|8|0|b;Crunch en polea|9|0|g;Elevación de piernas|9|0|b;Rueda abdominal|9|0|b;Plancha|9|0|b;Crunch|9|0|b`.split(';').map(s=>{const[n,m,c,q]=s.split('|');return{n,m:MU[m],c:+c,q}});
const SL={FB:[[5,1],[0,1],[1,1],[6,1],[2,1],[3,1],[4,1]],U:[[0,2],[1,2],[2,1],[3,1],[4,1]],L:[[5,2],[6,2],[7,1],[8,1],[9,1]],P:[[0,2],[2,2],[4,2]],Q:[[1,3],[2,1],[3,2]],L2:[[5,2],[6,2],[7,1],[8,1]]};
const NM={FB:'Full Body',U:'Torso',L:'Pierna',P:'Empuje',Q:'Tirón',L2:'Pierna'};
const TP={2:['FB','FB'],3:['FB','FB','FB'],4:['U','L','U','L'],5:['P','Q','L2','U','L'],6:['P','Q','L2','P','Q','L2']};
const RP={h:{c:[6,10],i:[10,15]},f:{c:[3,6],i:[8,12]},m:{c:[5,8],i:[8,12]}};
const GL={h:'Hipertrofia',m:'Mixto',f:'Fuerza'},LV=['Principiante','Intermedio','Avanzado'],MD={lineal:'Lineal',dup:'Ondulada (DUP)',bloques:'Bloques'};
const DEF={goal:'h',lv:1,days:4,eq:'g',focus:'',weeks:8,model:'lineal',de:4,dv:0.5};
let R=(()=>{try{const r=JSON.parse(localStorage.getItem('dmrb.v1'));if(r&&Array.isArray(r.days)){r.cfg=Object.assign({},DEF,r.cfg);return r}}catch(e){}return{name:'Mi rutina',cfg:{...DEF},days:[]}})();
let S={tab:0,wk:0,pk:null,out:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sv(){try{localStorage.setItem('dmrb.v1',JSON.stringify(R))}catch(e){}}
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
const op=(a,v)=>a.map(([k,t])=>`<option value="${k}"${k==v?' selected':''}>${t}</option>`).join('');
const sl=(k,a,l)=>`<label>${l}<select onchange="cf('${k}',this.value)">${op(a,R.cfg[k])}</select></label>`;
function cf(k,v){R.cfg[k]=['lv','days','weeks','de','dv'].includes(k)?+v:v;sv()}
function mkx(e,f){const c=R.cfg,rp=RP[c.goal][e.c?'c':'i'];return{n:e.n,m:e.m,c:e.c,sets:(e.c?[2,3,4][+c.lv]:[2,3,3][+c.lv])+f,reps:rp.slice(),rest:e.c?(c.goal=='f'?180:150):75}}
function gen(){const c=R.cfg,ok=e=>c.eq=='g'||(c.eq=='d'&&e.q!='g')||(c.eq=='b'&&e.q=='b'),occ={},cnt={},days=[];
TP[c.days].forEach((k,di)=>{cnt[k]=(cnt[k]||0)+1;const used=[],ex=[];
SL[k].forEach(([m,n])=>{const foc=MU[m]==c.focus?1:0,pool=E.filter(e=>e.m==MU[m]&&ok(e)),cs=pool.filter(e=>e.c),is=pool.filter(e=>!e.c),u=occ[m]=(occ[m]||0)+1;
for(let i=0;i<n+foc;i++){const a=(i==0&&cs.length)?cs:(is.length?is:cs);if(!a.length)break;let p;for(let t=0;t<a.length;t++){p=a[(u-1+Math.max(0,i-1)+t)%a.length];if(!used.includes(p.n))break}
if(used.includes(p.n))continue;used.push(p.n);ex.push(mkx(p,foc))}});
days.push({name:NM[k]+' '+'ABC'[cnt[k]-1],ex})});
R.days=days;S.tab=2;S.wk=0;sv();render();toast('Rutina generada')}
function blank(){R.days=[{name:'Día 1',ex:[]}];sv();S.tab=1;render()}
function wi(w){const c=R.cfg,D=+c.de,W=+c.weeks;let nd=0,t=0;for(let i=0;i<W;i++){if(!(D>0&&(i+1)%D==0)){t++;if(i<w)nd++}}return{dl:D>0&&(w+1)%D==0,pos:D>0?w%D:w,ph:Math.min(2,Math.floor(nd*3/Math.max(1,t)))}}
function xw(x,di,w){const c=R.cfg,i=wi(w),lv=+c.lv,mr=[2,1,0][lv],r0=[4,3,3][lv];let s=x.sets,lo=x.reps[0],hi=x.reps[1],rir,note;
if(i.dl){s=Math.max(1,Math.round(s*c.dv));rir=4;note='Descarga −10 %'}
else if(c.model=='bloques'){const p=i.ph;s=Math.max(1,s+[1,0,-1][p]);const sh=x.c?[3,0,-2][p]:[3,0,-1][p];lo+=sh;hi+=sh;rir=Math.max(mr,[3,2,1][p]);note=['Moderada','Sube ~2,5 %','Alta, marcas'][p]}
else{s+=Math.min(2,Math.floor((i.pos+1)/2));rir=Math.max(mr,r0-i.pos);if(c.model=='dup'&&x.c){const sh=[-3,0,4][di%3];lo+=sh;hi+=sh}note=w==0?'Calibra al RIR':'+2,5 % o +1 rep'}
lo=Math.max(1,lo);hi=Math.max(lo+1,hi);return{s,lo,hi,rir,note}}
function tl(w){const i=wi(w),m=R.cfg.model;return i.dl?'Descarga':m=='bloques'?['Acumulación','Intensificación','Realización'][i.ph]:m=='dup'?'Ondulada':'Progresiva'}
function vol(w){const v={};R.days.forEach((d,di)=>d.ex.forEach(x=>v[x.m]=(v[x.m]||0)+xw(x,di,w).s));return v}
const tot=w=>Object.values(vol(w)).reduce((a,b)=>a+b,0);
function rirOf(w){const x=R.days[0]&&R.days[0].ex[0];return x?xw(x,0,w).rir:'-'}
const nvs=['GENERAR','EDITAR','PLAN','ENTRENO','HISTORIAL','PROGRESO','EXPORTAR'];
function vG(){return`<div class=card><h3>Generador automático</h3><label>Nombre<input value="${esc(R.name)}" onchange="R.name=this.value;sv()"></label><div class=g2>${sl('goal',[['h','Hipertrofia'],['m','Mixto'],['f','Fuerza']],'Objetivo')}${sl('lv',[[0,'Principiante'],[1,'Intermedio'],[2,'Avanzado']],'Nivel')}${sl('days',[2,3,4,5,6].map(n=>[n,n+' días']),'Días / semana')}${sl('eq',[['g','Gimnasio'],['d','Mancuernas'],['b','Casa']],'Material')}</div>${sl('focus',[['','Sin prioridad'],...MU.map(m=>[m,m])],'Músculo prioritario (+1 ejercicio y +1 serie)')}</div>
<div class=card><h3>Periodización y descargas</h3><div class=g2>${sl('weeks',[4,5,6,7,8,9,10,11,12].map(n=>[n,n+' semanas']),'Mesociclo')}${sl('model',Object.entries(MD),'Modelo')}${sl('de',[[0,'Sin descarga'],[3,'Cada 3 sem.'],[4,'Cada 4 sem.'],[5,'Cada 5 sem.'],[6,'Cada 6 sem.']],'Descarga')}${sl('dv',[[0.4,'40 % series'],[0.5,'50 % series'],[0.6,'60 % series']],'Volumen en descarga')}</div><p class=m>El RIR baja cada semana, las series suben cada dos y la descarga recorta volumen y carga. Los ajustes valen también para rutinas manuales. Generar sustituye la rutina actual.</p></div>
<button class=btn onclick="gen()">GENERAR RUTINA</button><button class="btn g" onclick="blank()">CREAR MANUAL EN BLANCO</button>`}
function vE(){if(!R.days.length)return`<div class=card>No hay rutina. Genera una o empieza una en blanco.</div><button class=btn onclick="blank()">NUEVA RUTINA MANUAL</button>`;let h='';
R.days.forEach((d,i)=>{h+=`<div class=card><div class=row><input value="${esc(d.name)}" onchange="R.days[${i}].name=this.value;sv()"><button class="btn g s" onclick="dd(${i})">✕</button></div>`;
d.ex.forEach((x,j)=>{h+=`<div class=ex><b>${esc(x.n)}</b><small>${x.m}</small><div class=ctl><button class=b onclick="ch(${i},${j},-1)">−</button><b>${x.sets}</b><button class=b onclick="ch(${i},${j},1)">+</button><input class=n type=number inputmode=numeric value=${x.reps[0]} onchange="rp(${i},${j},0,this.value)"><span>–</span><input class=n type=number inputmode=numeric value=${x.reps[1]} onchange="rp(${i},${j},1,this.value)"><button class=b onclick="mv(${i},${j},-1)">↑</button><button class=b onclick="mv(${i},${j},1)">↓</button><button class=b onclick="rx(${i},${j})">✕</button></div></div>`});
if(S.pk&&S.pk.d==i){h+=`<div class=chips>${MU.map(m=>`<button class="chip${S.pk.m==m?' on':''}" onclick="S.pk.m='${m}';render()">${m}</button>`).join('')}</div>`;E.forEach((e,k)=>{if(e.m==S.pk.m)h+=`<button class="chip" style="width:100%;text-align:left;margin-bottom:5px" onclick="ad(${i},${k})">+ ${e.n}</button>`});h+=`<button class="btn g" onclick="S.pk=null;render()">CERRAR</button>`}
else h+=`<button class="btn g" onclick="S.pk={d:${i},m:'Pecho'};render()">+ AÑADIR EJERCICIO</button>`;h+=`</div>`});
return h+`<button class=btn onclick="R.days.push({name:'Día '+(R.days.length+1),ex:[]});sv();render()">+ AÑADIR DÍA</button>`}
function dd(i){R.days.splice(i,1);S.pk=null;sv();render()}
function ch(i,j,d){const x=R.days[i].ex[j];x.sets=Math.max(1,Math.min(10,x.sets+d));sv();render()}
function rp(i,j,k,v){const x=R.days[i].ex[j];x.reps[k]=Math.max(1,+v||1);if(x.reps[1]<=x.reps[0])x.reps[1]=x.reps[0]+1;sv();render()}
function mv(i,j,d){const a=R.days[i].ex,k=j+d;if(k<0||k>=a.length)return;[a[j],a[k]]=[a[k],a[j]];sv();render()}
function rx(i,j){R.days[i].ex.splice(j,1);sv();render()}
function ad(i,k){R.days[i].ex.push(mkx(E[k],0));sv();render()}
function vP(){if(!R.days.length)return`<div class=card>Aún no hay rutina. Genera una automática o crea una manual.</div>`;const W=+R.cfg.weeks,w=Math.min(S.wk,W-1);
let h=`<div class=card><h3>${esc(R.name)}</h3><div class=chips>`;for(let i=0;i<W;i++)h+=`<button class="chip${i==w?' on':''}" onclick="S.wk=${i};render()">S${i+1}${wi(i).dl?' ▼':''}</button>`;
h+=`</div><b>Semana ${w+1}: ${tl(w)}</b><p class=m>RIR objetivo ${rirOf(w)} · ${tot(w)} series semanales</p></div>`;
R.days.forEach((d,di)=>{h+=`<div class=card><h3>${esc(d.name)}</h3>`;d.ex.forEach(x=>{const k=xw(x,di,w);h+=`<div class=pl><span>${esc(x.n)}</span><em>${k.s} × ${k.lo}–${k.hi}</em><span>RIR ${k.rir}</span><span class=no>${x.m} · descanso ${x.rest} s · ${k.note}</span></div>`});h+=`</div>`});
const v=vol(w);h+=`<div class=card><h3>Volumen semanal por músculo</h3>`;MU.forEach(m=>{if(!v[m])return;const[a,b,c]=LM[m],n=v[m],st=n<a?'bajo':n<=b?'óptimo':n<=c?'alto':'excesivo';h+=`<div class=vb><span>${m}</span><div><i style="width:${Math.min(100,n/c*100)}%"></i></div><span>${n} · ${st}</span></div>`});h+=`<p class=m>Referencia orientativa de series efectivas por semana (mínimo, óptimo, máximo recuperable).</p></div><div class=card><h3>Mesociclo</h3><table><tr><th>Sem.</th><th>Fase</th><th>RIR</th><th>Series</th></tr>`;
for(let i=0;i<W;i++)h+=`<tr class="${wi(i).dl?'dl':''}"><td>${i+1}</td><td>${tl(i)}</td><td>${rirOf(i)}</td><td>${tot(i)}</td></tr>`;return h+`</table></div>`}
function vX(){return`<div class=card><h3>Exportar</h3><button class=btn onclick="xp('pdf')">PDF IMPRIMIBLE</button><button class="btn g" onclick="xp('csv')">HOJA EDITABLE (CSV)</button><button class="btn g" onclick="xp('json')">COPIA EDITABLE (JSON)</button><label>Importar copia JSON<input type=file accept=".json,application/json" onchange="imp(this)"></label><p class=m>Gratis y sin cuenta. Tus datos se guardan solo en este dispositivo.</p></div>${S.out?`<div class=card><h3>Copia manual</h3><textarea rows=8 readonly>${esc(S.out)}</textarea></div>`:''}`}
function rows(){const r=[['Semana','Fase','Día','Ejercicio','Músculo','Series','Reps','RIR','Descanso (s)','Carga']];for(let w=0;w<+R.cfg.weeks;w++)R.days.forEach((d,di)=>d.ex.forEach(x=>{const k=xw(x,di,w);r.push([w+1,tl(w),d.name,x.n,x.m,k.s,k.lo+'-'+k.hi,k.rir,x.rest,k.note])}));return r}
const en=t=>String(t).replace(/[—–−]/g,'-').replace(/[^\x20-\xFF]/g,'?').replace(/([\\()])/g,'\\$1');
